name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译并打包
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            name="gurl_${GITHUB_REF_NAME}_${goos}_${goarch}"
            bin=gurl
            if [ "$goos" = windows ]; then bin=gurl.exe; fi
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -buildvcs=false -ldflags="-s -w" -o "dist/$name/$bin" .
            if [ "$goos" = windows ]; then
              (cd "dist/$name" && zip -q "../$name.zip" "$bin")
            else
              tar -czf "dist/$name.tar.gz" -C "dist/$name" "$bin"
            fi
            rm -rf "dist/$name"
          done
          ls -lh dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            gurl：一个跑在浏览器里的 API 调试工具，单二进制起本地服务，界面在浏览器标签页里。

            - Params / Headers / Body（JSON、raw、urlencoded、form-data 含文件上传）
            - 请求体 gzip；响应自动解压、预览，超限落盘下载
            - SSE 流式响应：逐事件显示，可中途停止
            - 历史记录、环境变量 `{{var}}`、Cookie 罐（自动捕获/携带）
            - 集合树（可拖拽排序）；Host/Origin 校验，只服务本机页面
            - 预编译二进制：macOS（Intel / Apple Silicon）、Linux（x86_64 / arm64）、Windows（x86_64）
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$NOTES" \
            dist/*.tar.gz dist/*.zip
